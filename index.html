<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanvas LMS — Super Admin</title>
      <style>
      /* Launch splash shown instantly, before the JS bundle loads; React replaces it with the same-looking SplashScreen. */
      html, body { margin: 0; background: #5c2d91; }
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; background: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1.5px) 0 0 / 26px 26px, #5c2d91; }
      .boot-mark { position: relative; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; margin-bottom: 28px; }
      .boot-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(255,255,255,.12); border-left-color: rgba(255,255,255,.85); animation: boot-spin 1.1s linear infinite; }
      .boot-tile { width: 68px; height: 68px; border-radius: 20px; background: #fff; color: #5c2d91; font-size: 34px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
      .boot img { height: 28px; margin-bottom: 8px; }
      .boot p { margin: 0 0 18px; font-size: 14px; color: rgba(255,255,255,.72); }
      .boot-bar { position: relative; width: 176px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; }
      .boot-bar i { position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 3px; background: #fff; animation: boot-slide 1.4s ease-in-out infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-slide { 0% { left: -40%; } 100% { left: 100%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-mark"><span class="boot-ring"></span><span class="boot-tile">K</span></div>
        <img src="/kanvas-logo-white.png" alt="Kanvas" />
        <p>Preparing your workspace…</p>
        <div class="boot-bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
